name: CI & Extension Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  test-and-build:
    name: Test and Build
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Build Chrome extension
        run: npm run build:chrome

      - name: Build Firefox extension
        run: npm run build:firefox

      - name: Package extension archives
        run: |
          mkdir -p release
          (cd dist_chrome && zip -r ../release/clean-new-tab-chrome.zip .)
          (cd dist_firefox && zip -r ../release/clean-new-tab-firefox.zip .)

      - name: Upload Chrome build artifact
        uses: actions/upload-artifact@v4
        with:
          name: clean-new-tab-chrome
          path: release/clean-new-tab-chrome.zip

      - name: Upload Firefox build artifact
        uses: actions/upload-artifact@v4
        with:
          name: clean-new-tab-firefox
          path: release/clean-new-tab-firefox.zip
