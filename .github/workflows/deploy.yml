name: Deploy Extension to Stores

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-and-publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
      FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Build Chrome extension
        run: npm run build:chrome

      - name: Build Firefox extension
        run: npm run build:firefox

      - name: Package extension archives
        run: |
          mkdir -p release
          (cd dist_chrome && zip -r ../release/clean-new-tab-chrome.zip .)
          (cd dist_firefox && zip -r ../release/clean-new-tab-firefox.zip .)
          zip -r release/source-code.zip . -x "node_modules/*" "dist_chrome/*" "dist_firefox/*" "release/*" ".git/*"

      - name: Upload Chrome build artifact
        uses: actions/upload-artifact@v4
        with:
          name: clean-new-tab-chrome
          path: release/clean-new-tab-chrome.zip

      - name: Upload Firefox build artifact
        uses: actions/upload-artifact@v4
        with:
          name: clean-new-tab-firefox
          path: release/clean-new-tab-firefox.zip

      - name: Upload Source Code artifact
        uses: actions/upload-artifact@v4
        with:
          name: clean-new-tab-source
          path: release/source-code.zip

      # --- CHROME WEB STORE PUBLISHING ---
      - name: Notice - Chrome Credentials Check
        if: ${{ env.CHROME_EXTENSION_ID == '' }}
        run: echo "::warning ::CHROME_EXTENSION_ID is not configured. Skipping Chrome Web Store deployment."

      - name: Upload to Chrome Web Store
        if: ${{ env.CHROME_EXTENSION_ID != '' }}
        uses: mnao305/chrome-extension-upload@v7.0.0
        with:
          file-path: release/clean-new-tab-chrome.zip
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          publisher-id: ${{ secrets.CHROME_PUBLISHER_ID }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          publish: true

      # --- MOZILLA ADD-ONS (AMO) PUBLISHING ---
      - name: Notice - Firefox Credentials Check
        if: ${{ env.FIREFOX_JWT_ISSUER == '' }}
        run: echo "::warning ::FIREFOX_JWT_ISSUER is not configured. Skipping Firefox Add-ons deployment."

      - name: Upload to Firefox Add-ons (AMO)
        if: ${{ env.FIREFOX_JWT_ISSUER != '' }}
        uses: wdzeng/firefox-addon@v1
        with:
          addon-guid: 'clean-new-tab@zubovdns.github.io'
          xpi-path: release/clean-new-tab-firefox.zip
          source-file-path: release/source-code.zip
          jwt-issuer: ${{ secrets.FIREFOX_JWT_ISSUER }}
          jwt-secret: ${{ secrets.FIREFOX_JWT_SECRET }}
          self-hosted: false
