<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep slate obsidian -->
    <linearGradient id="bgSlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22242b" />
      <stop offset="100%" stop-color="#101114" />
    </linearGradient>

    <!-- Outer Border Gradient -->
    <linearGradient id="outerBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.22)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.04)" />
    </linearGradient>

    <!-- Electric Sapphire Tile Gradient -->
    <linearGradient id="tileBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Tile Inner Highlight -->
    <linearGradient id="tileHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.25)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0)" />
    </linearGradient>
  </defs>

  <!-- Base Squircle -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bgSlate)" stroke="url(#outerBorder)" stroke-width="1.5" />

  <!-- 4 Speed Dial Tiles: 42x42 each, 6px gap -->
  <!-- Top Left -->
  <rect x="19" y="19" width="42" height="42" rx="12" fill="url(#tileBlue)" stroke="url(#tileHighlight)" stroke-width="1" />

  <!-- Top Right -->
  <rect x="67" y="19" width="42" height="42" rx="12" fill="url(#tileBlue)" stroke="url(#tileHighlight)" stroke-width="1" />

  <!-- Bottom Left -->
  <rect x="19" y="67" width="42" height="42" rx="12" fill="url(#tileBlue)" stroke="url(#tileHighlight)" stroke-width="1" />

  <!-- Bottom Right: Action Tile with White Plus -->
  <rect x="67" y="67" width="42" height="42" rx="12" fill="url(#tileBlue)" stroke="url(#tileHighlight)" stroke-width="1" />

  <!-- Centered Bold White Plus -->
  <line x1="88" y1="75" x2="88" y2="101" stroke="#ffffff" stroke-width="7.5" stroke-linecap="round" />
  <line x1="75" y1="88" x2="101" y2="88" stroke="#ffffff" stroke-width="7.5" stroke-linecap="round" />
</svg>
